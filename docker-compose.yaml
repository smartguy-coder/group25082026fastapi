services:
  backend:
    build:
      dockerfile: Dockerfile
      context: ./backend
    container_name: backend
    restart: always
    ports:
      - "8001:8000"
    command: |
      sh -c "
        uv run uvicorn main:app --host=0.0.0.0 --port=8000 --reload
      "
  frontend:
    build:
      dockerfile: Dockerfile
      context: ./frontend
    container_name: frontend
    restart: always
    ports:
      - "8002:8000"
    command: |
      sh -c "
        uv run uvicorn main:app --host=0.0.0.0 --port=8000 --reload
      "
