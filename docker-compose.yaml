services:
  backend:
    build:
      dockerfile: Dockerfile
      context: ./backend
    container_name: backend
    restart: always
    volumes:
      - ./backend/app:/app
    env_file:
      - .env
    networks:
      - main_network
    ports:
      - "8001:8000"
    command: |
      sh -c "
        uv run uvicorn main:app --host=0.0.0.0 --port=8000 --reload
      "

  frontend:
    build:
      dockerfile: Dockerfile
      context: ./frontend
    container_name: frontend
    restart: always
    volumes:
      - ./frontend/app:/app
    env_file:
      - .env
    ports:
      - "8002:8000"
    command: |
      sh -c "
        uv run uvicorn main:app --host=0.0.0.0 --port=8000 --reload
      "

  postgres:
      image: postgres:18
      container_name: postgres
      restart: unless-stopped
      env_file:
        - .env
      ports:
        - "5678:5432"
      environment:
        POSTGRES_DB: ${POSTGRES_DB}
        POSTGRES_USER: ${POSTGRES_USER}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      volumes:
        - postgres_data:/var/lib/postgresql
      networks:
        - main_network

volumes:
  postgres_data:

networks:
  main_network:
    driver: bridge
