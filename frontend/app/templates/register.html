{% extends "base.html" %}


{% block content %}







<form method="post">
  <div class="mb-3">
    <label for="email" class="form-label">Email</label>
    <input name="email" type="email" class="form-control" id="email" aria-describedby="emailHelp" required value="{{ email }}">
    <div id="emailHelp" class="form-text">We'll never share your email with anyone else.</div>
  </div>

    <div class="mb-3">
    <label for="name" class="form-label">User name</label>
    <input name="name" type="text" class="form-control" id="name"  required minlength="2" value="{{ name }}">
  </div>

  <div class="mb-3">
    <label for="password" class="form-label">Password</label>
    <input name="password" type="password" class="form-control" id="password" required minlength="8">
  </div>
  <button type="submit" class="btn btn-primary">Submit</button>
</form>


{% endblock %}
